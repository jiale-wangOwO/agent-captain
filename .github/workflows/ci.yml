name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      # CI never starts a real SSH target, user terminal, or model inference.
      CEO_HUB_LIVE_TESTS: '0'
      CEO_HUB_REMOTE_TESTS: '0'
      PRON_HUB_LIVE_TESTS: '0'
      PRON_HUB_REMOTE_TESTS: '0'
      RUN_WINDOWS_BACKGROUND_LIVE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Check candidate publication contents
        run: python scripts/check_publication.py --tracked
      - name: Install terminal dependencies
        run: npm ci
      - name: Install checkout CLI
        run: python -m pip install -e .
      - name: Python unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Terminal unit tests
        run: npm run test:terminal
      - name: Browser contract and rendering unit tests
        run: npm run test:ui
