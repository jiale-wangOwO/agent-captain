name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Publication and CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_tests: ${{ steps.scope.outputs.full_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both push endpoints and the PR base must be available for git diff.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify documentation, publication, and CI scope rules
        run: python3 -m unittest tests.test_repository_presentation tests.test_publication tests.test_ci_scope -v
      - name: Check candidate publication contents
        run: python3 scripts/check_publication.py --tracked
      - name: Select test scope
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_scope.py

  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Node 22
    needs: preflight
    if: needs.preflight.outputs.full_tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      # CI never starts a real SSH target, user terminal, or model inference.
      CEO_HUB_LIVE_TESTS: '0'
      CEO_HUB_REMOTE_TESTS: '0'
      PRON_HUB_LIVE_TESTS: '0'
      PRON_HUB_REMOTE_TESTS: '0'
      RUN_WINDOWS_BACKGROUND_LIVE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install terminal dependencies
        run: npm ci
      - name: Install checkout CLI
        run: python -m pip install -e .
      - name: Python unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Terminal unit tests
        run: npm run test:terminal
      - name: Browser contract and rendering unit tests
        run: npm run test:ui

  ci-result:
    name: CI result
    if: always()
    needs: [preflight, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require publication checks and the selected tests
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FULL_TESTS: ${{ needs.preflight.outputs.full_tests }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          if [ "$FULL_TESTS" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$FULL_TESTS" = false
            test "$TEST_RESULT" = skipped
          fi
