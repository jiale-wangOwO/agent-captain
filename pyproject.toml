[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-captain"
version = "0.7.0"
description = "One captain for agents across your machines."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
agent-captain = "agent_captain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_captain*"]

[tool.setuptools]
include-package-data = false
